name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Versions agree
        # Four artefacts ship under one version number. A release that bumps only
        # some of them is the failure this catches.
        run: python scripts/check-versions.py
      - name: Type check
        run: mypy src
      - name: Tests (no live browser)
        run: pytest -m "not e2e"
